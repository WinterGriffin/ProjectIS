<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>FitBuilder — Gym Planner</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="authContainer" class="centered">
    <div class="card auth-card">
      <div class="brand">
        <div class="logo">🏋️</div>
        <h1>FitBuilder</h1>
        <p class="muted">Build workouts & meal plans</p>
      </div>

      <div class="form">
        <label>Username
          <input id="authUsername" type="text" autocomplete="username" />
        </label>
        <label>Password
          <input id="authPassword" type="password" autocomplete="current-password" />
        </label>

        <label class="password-toggle">
          <input id="showPassword" type="checkbox" />
          <span>Show password</span>
        </label>

        <button id="authSubmit" class="btn primary">Login</button>
        <button id="authToggle" class="btn ghost">Need an account? Sign up</button>
      </div>
    </div>
  </div>

  <div id="app" class="hidden">
    <nav class="topnav">
      <div class="brand-left">
        <div class="logo">🏋️</div>
        <div class="title">FitBuilder</div>
      </div>
      <div class="brand-right">
        <span id="welcomeText"></span>
        <button id="logoutBtn" class="btn ghost">Logout</button>
      </div>
    </nav>

    <main class="container">
      <aside class="tabs">
        <button id="tabProfile" class="tab active">Profile</button>
        <button id="tabExercises" class="tab">Exercises</button>
        <button id="tabMeals" class="tab">Meal Planner</button>
      </aside>

      <section class="panel" id="panelProfile">
        <h2>Your Profile</h2>
        <div class="grid">
          <label>Weight (kg)<input id="inputWeight" type="number" /></label>
          <label>Height (cm)<input id="inputHeight" type="number" /></label>
          <label>Age<input id="inputAge" type="number" /></label>
          <label>Gender
            <select id="inputGender">
              <option value="">Select</option>
              <option value="male">Male</option>
              <option value="female">Female</option>
            </select>
          </label>
        </div>
        <div id="bmrBox" class="bmr hidden">
          <div class="bmr-col">Lose: <strong id="bmrLose"></strong></div>
          <div class="bmr-col">Maintain: <strong id="bmrMaintain"></strong></div>
          <div class="bmr-col">Gain: <strong id="bmrGain"></strong></div>
        </div>
      </section>

      <section class="panel hidden" id="panelExercises">
        <div class="split">
          <div class="left">
            <h2>Exercise Library</h2>
            <div class="search">
              <input id="exerciseSearch" placeholder="Search exercises or category..." />
            </div>
            <div id="exerciseList" class="list scroll"></div>
          </div>

          <div class="right">
            <h3>Your Workout</h3>
            <div id="selectedExercises" class="list"></div>

            <div id="sessionControls">
              <input id="sessionName" placeholder="Session name (e.g., Push Day)" />
              <div class="row">
                <button id="saveSession" class="btn primary">Save Session</button>
                <button id="clearSelection" class="btn">Clear</button>
              </div>
            </div>

            <h4>Saved Sessions</h4>
            <div id="sessionsList" class="list"></div>
          </div>
        </div>
      </section>

      <section class="panel hidden" id="panelMeals">
        <div class="split">
          <div class="left">
            <h2>Meal Database</h2>
            <div class="search">
              <input id="mealSearch" placeholder="Search meals or category..." />
            </div>
            <div id="mealList" class="list scroll"></div>
          </div>

          <div class="right">
            <h3>Daily Plan</h3>
            <label>Calorie Goal<input id="calorieGoal" type="number" /></label>
            <div class="summary">
              <div>Total: <strong id="totalMealCalories">0</strong> cal</div>
              <div>Diff: <strong id="calDiff">0</strong> cal</div>
            </div>

            <div id="selectedMeals" class="list"></div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script src="apps.js"></script>
</body>
</html>
